```html
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 1</title>
</head>
<body>

    <h2>Llogaritësi i numrave</h2>

    <label for="nr1">Numri i parë:</label>
    <input type="number" id="nr1">
    <br><br>

    <label for="nr2">Numri i dytë:</label>
    <input type="number" id="nr2">
    <br><br>

    <button type="button" onclick="sum()">Mbledhja (+)</button>
    <button type="button" onclick="zbritje()">Zbritja (-)</button>
    <button type="button" onclick="shumezimi()">Shumëzimi (*)</button>
    <button type="button" onclick="pjestimi()">Pjesëtimi (/)</button>

    <p id="result"></p>

    <script>
        function sum() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            var c = a + b;

            document.getElementById("result").innerHTML =
                "Rezultati i mbledhjes është: " + c;
        }

        function zbritje() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            var c = a - b;

            document.getElementById("result").innerHTML =
                "Rezultati i zbritjes është: " + c;
        }

        function shumezimi() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            var c = a * b;

            document.getElementById("result").innerHTML =
                "Rezultati i shumëzimit është: " + c;
        }

        function pjestimi() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            if (b === 0) {
                document.getElementById("result").innerHTML =
                    "Nuk mund të pjesëtohet me 0!";
            } else {
                var c = a / b;

                document.getElementById("result").innerHTML =
                    "Rezultati i pjesëtimit është: " + c;
            }
        }
    </script>

    <br>
    <hr>

    <h1>Rritje/Zbritje të numrit</h1>

    <p id="numri">0</p>

    <button type="button" onclick="rritje()">Rritje (+)</button>
    <button type="button" onclick="zbritjaNumrit()">Zbritje (-)</button>

    <script>
        var n = 0;

        function rritje() {
            n = n + 1;
            document.getElementById("numri").innerHTML = n;
        }

        function zbritjaNumrit() {
            n = n - 1;
            document.getElementById("numri").innerHTML = n;
        }
    </script>

</body>
</html>
```
