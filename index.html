
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 1</title>
</head>
<body>

    <h2>Llogaritësi i numrave</h2>

    <label for="nr1">Numri i parë:</label>
    <input type="number" id="nr1">
    <br><br>

    <label for="nr2">Numri i dytë:</label>
    <input type="number" id="nr2">
    <br><br>

    <button type="button" onclick="sum()">Mbledhja (+)</button>
    <button type="button" onclick="zbritje()">Zbritja (-)</button>
    <button type="button" onclick="shumezimi()">Shumëzimi (*)</button>
    <button type="button" onclick="pjestimi()">Pjesëtimi (/)</button>

    <p id="result"></p>

    <script>
        function sum() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            var c = a + b;

            document.getElementById("result").innerHTML =
                "Rezultati i mbledhjes është: " + c;
        }

        function zbritje() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            var e = a - b;

            document.getElementById("result").innerHTML =
                "Rezultati i zbritjes është: " + e;
        }

        function shumezimi() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            var s = a * b;

            document.getElementById("result").innerHTML =
                "Rezultati i shumëzimit është: " + s;
        }

        function pjestimi() {
            var a = Number(document.getElementById("nr1").value);
            var b = Number(document.getElementById("nr2").value);

            if (b === 0) {
                document.getElementById("result").innerHTML =
                    "Gabim: Pjesëtimi me zero nuk lejohet!";
                return;
            }

            var p = a / b;

            document.getElementById("result").innerHTML =
                "Rezultati i pjesëtimit është: " + p;
        }
    </script>

</body>
</html>
